# Render Blueprint: creates the CampusHub web service and its PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: campushub
    runtime: python
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: gunicorn campushub.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campushub-db
          property: connectionString
      # Load demo posts/users on the first deploy (skipped once posts exist)
      - key: SEED_DEMO_DATA
        value: "true"
      # Cloudinary stores uploaded images; Render asks for these on first deploy
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: campushub-db
    plan: free
    databaseName: campushub
    user: campushub
