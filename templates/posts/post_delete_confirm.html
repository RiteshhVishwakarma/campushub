{% extends 'base.html' %}

{% block title %}Delete Post - CampusHub{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-lg p-8">
        
        <!-- Warning Icon -->
        <div class="text-center mb-6">
            <svg class="w-16 h-16 mx-auto text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        
        <!-- Confirmation Message -->
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-4">Delete Post?</h1>
        <p class="text-gray-600 text-center mb-6">Are you sure you want to delete this post?</p>
        
        <!-- Post Preview -->
        <div class="bg-gray-50 rounded-lg p-4 mb-6">
            <p class="font-semibold text-gray-800">{{ post.title }}</p>
            <p class="text-sm text-gray-600 mt-1">{{ post.get_category_display }}</p>
        </div>
        
        <!-- Buttons -->
        <form method="post" class="space-y-3">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-500 text-white font-semibold py-3 rounded-lg hover:bg-red-600 transition">
                Delete
            </button>
            <a href="{% url 'posts:post_detail' post.pk %}" class="block w-full bg-gray-100 text-gray-700 text-center font-semibold py-3 rounded-lg hover:bg-gray-200 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
