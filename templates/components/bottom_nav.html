<!-- Bottom Navigation Bar - Premium Mobile -->
<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-neutral-200 z-50 md:hidden no-print">
    <div class="flex items-center justify-around h-16 px-2">
        
        <!-- Home -->
        <a href="{% url 'core:home' %}" class="flex flex-col items-center justify-center gap-1 px-3 py-2 rounded-lg {% if request.resolver_match.url_name == 'home' %}text-primary-600{% else %}text-neutral-600{% endif %} hover:bg-neutral-50 transition-colors flex-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span class="text-xs font-medium">Home</span>
        </a>
        
        <!-- Browse Posts -->
        <a href="{% url 'posts:post_list' %}" class="flex flex-col items-center justify-center gap-1 px-3 py-2 rounded-lg {% if 'posts' in request.path and 'create' not in request.path and 'my-posts' not in request.path %}text-primary-600{% else %}text-neutral-600{% endif %} hover:bg-neutral-50 transition-colors flex-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span class="text-xs font-medium">Browse</span>
        </a>
        
        <!-- Create Post -->
        {% if user.is_authenticated %}
        <a href="{% url 'posts:post_create' %}" class="flex flex-col items-center justify-center -mt-4">
            <div class="bg-primary-500 text-white rounded-2xl p-3.5 shadow-lg hover:bg-primary-600 transition-all hover:scale-105">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
        </a>
        {% else %}
        <a href="{% url 'accounts:login' %}?next={% url 'posts:post_create' %}" class="flex flex-col items-center justify-center -mt-4">
            <div class="bg-neutral-200 text-neutral-400 rounded-2xl p-3.5 shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
        </a>
        {% endif %}
        
        <!-- My Posts / Register -->
        {% if user.is_authenticated %}
        <a href="{% url 'posts:my_posts' %}" class="flex flex-col items-center justify-center gap-1 px-3 py-2 rounded-lg {% if 'my-posts' in request.path %}text-primary-600{% else %}text-neutral-600{% endif %} hover:bg-neutral-50 transition-colors flex-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <span class="text-xs font-medium">My Posts</span>
        </a>
        {% else %}
        <a href="{% url 'accounts:register' %}" class="flex flex-col items-center justify-center gap-1 px-3 py-2 rounded-lg {% if 'register' in request.path %}text-primary-600{% else %}text-neutral-600{% endif %} hover:bg-neutral-50 transition-colors flex-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
            </svg>
            <span class="text-xs font-medium">Sign up</span>
        </a>
        {% endif %}
        
        <!-- Profile / Login -->
        {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}" class="flex flex-col items-center justify-center gap-1 px-3 py-2 rounded-lg {% if 'profile' in request.path %}text-primary-600{% else %}text-neutral-600{% endif %} hover:bg-neutral-50 transition-colors flex-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span class="text-xs font-medium">Profile</span>
        </a>
        {% else %}
        <a href="{% url 'accounts:login' %}" class="flex flex-col items-center justify-center gap-1 px-3 py-2 rounded-lg {% if 'login' in request.path %}text-primary-600{% else %}text-neutral-600{% endif %} hover:bg-neutral-50 transition-colors flex-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
            <span class="text-xs font-medium">Login</span>
        </a>
        {% endif %}
    </div>
</nav>
