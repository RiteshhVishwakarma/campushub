<!-- Top Navigation Bar - Premium & Minimal -->
<nav class="bg-white border-b border-neutral-200 sticky top-0 z-50 no-print">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <a href="{% url 'core:home' %}" class="flex items-center gap-2 group">
                <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105">
                    <span class="text-white font-bold text-base">C</span>
                </div>
                <span class="text-lg font-semibold text-neutral-900 hidden sm:block">CampusHub</span>
            </a>
            
            <!-- Right Side Actions -->
            <div class="flex items-center gap-3">
                {% if user.is_authenticated %}
                    <!-- User Menu -->
                    <button id="userMenuBtn" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-neutral-100 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-500">
                        <div class="w-7 h-7 bg-primary-500 rounded-full flex items-center justify-center">
                            <span class="text-white text-xs font-semibold">{{ user.first_name|first|upper|default:user.username|first|upper }}</span>
                        </div>
                        <span class="text-sm font-medium text-neutral-700 hidden md:block">{{ user.first_name|default:user.username }}</span>
                        <svg class="w-4 h-4 text-neutral-500 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                {% else %}
                    <!-- Login & Register Buttons -->
                    <a href="{% url 'accounts:login' %}" class="text-sm font-medium text-neutral-900 hover:text-neutral-600 px-3 py-2 rounded-lg hover:bg-neutral-100 transition-colors">
                        Login
                    </a>
                    <a href="{% url 'accounts:register' %}" class="hidden sm:inline-flex items-center gap-2 px-4 py-2 bg-neutral-900 text-white text-sm font-medium rounded-lg hover:bg-neutral-800 transition-colors">
                        Sign up
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
    
    <!-- User Dropdown Menu -->
    {% if user.is_authenticated %}
    <div id="userMenu" class="hidden absolute right-4 mt-2 w-56 bg-white rounded-xl border border-neutral-200 shadow-lg py-1 z-50">
        <div class="px-4 py-3 border-b border-neutral-100">
            <p class="text-sm font-semibold text-neutral-900">{{ user.first_name|default:user.username }}</p>
            <p class="text-xs text-neutral-500 mt-0.5 truncate">{{ user.email }}</p>
        </div>
        <a href="{% url 'accounts:profile' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-neutral-700 hover:bg-neutral-50 transition-colors">
            <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Profile
        </a>
        <a href="{% url 'posts:my_posts' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-neutral-700 hover:bg-neutral-50 transition-colors">
            <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            My Posts
        </a>
        <div class="border-t border-neutral-100 my-1"></div>
        <a href="{% url 'accounts:logout' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Logout
        </a>
    </div>
    {% endif %}
</nav>

<script>
    // Toggle user menu
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userMenu = document.getElementById('userMenu');
    
    if (userMenuBtn && userMenu) {
        userMenuBtn.addEventListener('click', () => {
            userMenu.classList.toggle('hidden');
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) {
                userMenu.classList.add('hidden');
            }
        });
    }
</script>
